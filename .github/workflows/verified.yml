name: Verified correctness

on:
  push:
    branches: [fast, 'proof/**', 'experiment/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  aarch64-macos:
    runs-on: macos-15
    timeout-minutes: 40
    env:
      HOMEBREW_NO_AUTO_UPDATE: '1'
    steps:
      - name: Checkout complete proof baseline and test sources
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          submodules: true
          persist-credentials: false
      - name: System dependencies
        run: brew install gmp pkgconf
      - name: Frozen local toolchain
        run: make -f Makefile.fast bootstrap
      - name: Full proofs, independent kernel check and preserved logical assumptions
        run: make -f Makefile.fast proofs
      - name: Validators, experimental profiles, native NEON, regressions, ABI and PIC
        run: make -f Makefile.fast verify
      - name: Preserve results and failure diagnostics
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: verified-correctness-aarch64-macos
          path: |
            perf/results/
            perf/artifacts/proofs/
            perf/artifacts/validators/
            perf/artifacts/experiments/
            perf/artifacts/neon/
            perf/artifacts/packed-neon/
            perf/artifacts/loop-optimizations/
            perf/artifacts/assembly-comparison/
            perf/artifacts/memory-assembly/
            perf/artifacts/memory-loops/
            perf/artifacts/memvector/
            perf/artifacts/memoryneon/
            perf/artifacts/pointerneon/
            perf/artifacts/autopair/
            perf/artifacts/arraypair/
            perf/artifacts/arraypair-wide/
            perf/artifacts/compilation-compatibility/
            perf/artifacts/peeltwo/
            perf/artifacts/loopfusion/
            perf/artifacts/loopinterchange/
            perf/artifacts/looptile/
            perf/artifacts/looptile2d/
            perf/artifacts/vectorize/
            perf/artifacts/preheader_licm/
            perf/artifacts/lowerlong/
            perf/artifacts/native-experiments/
          retention-days: 14
